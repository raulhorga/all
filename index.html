<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Personal Project Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <button id="mobileMenuBtn" class="icon-btn mobile-only" aria-label="Deschide meniul">☰</button>
        <div class="brand-mark">P</div>
        <div>
          <div class="brand-title">Project Hub</div>
          <div class="brand-subtitle">Personal workspace</div>
        </div>
      </div>

      <nav id="topMenu" class="top-menu" aria-label="Meniu principal"></nav>

      <div class="top-actions">
        <button id="themeBtn" class="icon-btn" aria-label="Schimbă tema">◐</button>
      </div>
    </header>

    <div class="workspace">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <span>Collections</span>
          <button id="closeSidebarBtn" class="icon-btn mobile-only" aria-label="Închide meniul">✕</button>
        </div>

        <div id="sideMenus"></div>

        <div class="sidebar-footer">
          <span class="dot"></span>
          <span>Config-driven</span>
        </div>
      </aside>

      <main class="main">
        <div class="content-toolbar">
          <div>
            <div id="breadcrumb" class="breadcrumb">Home</div>
            <h1 id="pageTitle">Dashboard</h1>
          </div>
          <div id="pageActions" class="page-actions"></div>
        </div>

        <section id="content" class="content-card"></section>
      </main>
    </div>
  </div>

  <div id="overlay" class="overlay"></div>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
